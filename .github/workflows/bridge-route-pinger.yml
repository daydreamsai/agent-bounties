name: Bridge Route Pinger CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd submissions/bridge-route-pinger
          npm ci

      - name: Build
        run: |
          cd submissions/bridge-route-pinger
          npm run build
        env:
          SOCKET_API_KEY: ${{ secrets.SOCKET_API_KEY }}
          X402_HMAC_SECRET: ${{ secrets.X402_HMAC_SECRET }}